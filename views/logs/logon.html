<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - brillilink</title>
    <link rel="stylesheet" href="../../style/styles.css"> 
</head>
<body>

<div class="container">
    <header class="header">
        <img src="../../logo.png" alt="logo" class="logo">
        <nav class="nav-title">brillilink</nav>
        <div class="auth-container">
            <div class="login"><a href="login.html">Log in</a></div>
        </div>
    </header>

    <aside class="sidebar">
        <h3>Navegación</h3>
        <ul>
            <li onclick="window.location.href='../main/principal_ing.html'">Principal</li>
        </ul>
    </aside>

    <main class="main">
        <!-- Formulario de registro con campos adicionales y validación -->
        <form action="../main/principal_log.html" method="GET" autocomplete="on">
            <fieldset style="border: none;">
                <h2 style="color: #1e3a8a; text-align: center; margin-bottom: 20px;">Formulario de Registro</h2>
                
                <!-- Sección de Nombre y Apellidos en la misma línea (ambos requeridos) -->
                <div class="form">
                    <label for="name">Nombre:</label>
                    <input type="text" id="name" name="name" placeholder="Introduce tu nombre" required>
                    
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" name="apellidos" placeholder="Introduce tus apellidos" required>
                </div>

                <div class="form">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Introduce tu contraseña" required minlength="8">
                </div>

                <!-- Campos individuales -->
                <div class="form">
                    <label for="ubicacion">Ubicación:</label>
                    <input type="text" id="ubicacion" name="ubicacion" placeholder="Introduce tu ubicación" required>
                </div>

                <!-- Teléfono -->
                <div class="form">
                    <label for="telefono">Teléfono:</label>
                    <input type="number" id="telefono" name="telefono" placeholder="Introduce tu teléfono">
                </div>

                <div class="form">
                    <label for="correo">Correo:</label>
                    <input type="email" id="correo" name="correo" placeholder="Introduce tu correo" required>
                </div>

                <div class="form">
                    <label for="descripcion">Descripción/CV:</label>
                    <textarea id="descripcion" name="descripcion" rows="4" placeholder="Introduce una breve descripción o CV"></textarea>
                </div>  

                <!-- Botón de envío -->
                <button type="submit" class="btn-contact" style="width: 100%; margin-top: 20px;" aria-label="Enviar formulario de registro">
                    Registrarse
                </button>

            </fieldset>
        </form>
    </main>

    <footer class="footer">
        <div class="footer-info">
            <p><strong>Nuestra Oficina</strong></p>
            <p>Florida, España</p>
        </div>
        
        <div class="map-container">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3082.954191859724!2d-0.417597815673236!3d39.40254239844637!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd604e82a8672a35%3A0xed578f5f80fed685!2sFlorida%20Universit%C3%A0ria!5e0!3m2!1ses!2ses!4v1776841605472!5m2!1ses!2ses" 
                width="320" height="80" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </footer>
</div>

</body>
</html>
