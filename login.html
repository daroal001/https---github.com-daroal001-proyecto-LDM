<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Básico</title>
    <link rel="stylesheet" href="styles.css"> 
    <title></title>
</head>
<body>
<form action="/ruta-de-procesamiento" method="POST">
    <!-- Sección de Nombre y Apellidos en la misma línea (ambos requeridos) -->
    <div class="form-group">
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name" required>
        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" name="apellidos" required>
    </div>

    <!-- Campos individuales -->
    <div class="form-group">
        <label for="descripcion">Descripción/CV:</label>
        <textarea id="descripcion" name="descripcion" rows="4"></textarea>
    </div>
    
    <div class="form-group">
        <label for="ubicacion">Ubicación:</label>
        <input type="text" id="ubicacion" name="ubicacion" required> <!-- Requerido -->
    </div>

    <div class="form-group">
        <label for="horario">Horario:</label>
        <input type="text" id="horario" name="horario">
    </div>

    <div class="form-group">
        <label for="salario">Salario:</label>
        <input type="number" id="salario" name="salario">
    </div>

    <!-- Nuevo campo Teléfono -->
    <div class="form-group">
        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono">
    </div>

    <div class="form-group">
        <label for="correo">Correo:</label>
        <input type="email" id="correo" name="correo" required>
    </div>

    <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password">
    </div>

    <!-- Botón de envío -->
    <button type="submit">Enviar</button>
</form>
</body>
</html>
